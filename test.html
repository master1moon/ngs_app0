<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اختبار</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        .success { color: green; }
        .error { color: red; }
        .info { margin: 10px 0; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>صفحة اختبار النظام</h1>
    
    <div id="results"></div>
    
    <div class="info">
        <h3>الملفات المتاحة:</h3>
        <ul>
            <li><a href="index.html">index.html (الأصلي - يعمل بشكل طبيعي)</a></li>
            <li><a href="index-optimized.html">index-optimized.html (المحسّن - تجريبي)</a></li>
        </ul>
    </div>
    
    <script>
        const results = document.getElementById('results');
        
        // اختبار تحميل المكتبات الأساسية
        const tests = [
            { name: 'Bootstrap', check: () => typeof bootstrap !== 'undefined' },
            { name: 'Moment.js', check: () => typeof moment !== 'undefined' },
            { name: 'XLSX', check: () => typeof XLSX !== 'undefined' },
            { name: 'localStorage', check: () => {
                try {
                    localStorage.setItem('test', 'test');
                    localStorage.removeItem('test');
                    return true;
                } catch(e) {
                    return false;
                }
            }}
        ];
        
        // تحميل المكتبات الخارجية
        const scripts = [
            'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
        ];
        
        let loaded = 0;
        scripts.forEach(src => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => {
                loaded++;
                if (loaded === scripts.length) {
                    runTests();
                }
            };
            document.head.appendChild(script);
        });
        
        function runTests() {
            results.innerHTML = '<h2>نتائج الاختبار:</h2>';
            
            tests.forEach(test => {
                const passed = test.check();
                const div = document.createElement('div');
                div.className = passed ? 'success' : 'error';
                div.textContent = `${test.name}: ${passed ? '✓ يعمل' : '✗ لا يعمل'}`;
                results.appendChild(div);
            });
            
            // معلومات إضافية
            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <h3>معلومات النظام:</h3>
                <p>المتصفح: ${navigator.userAgent}</p>
                <p>اللغة: ${navigator.language}</p>
                <p>التاريخ: ${new Date().toLocaleDateString('ar-SA')}</p>
            `;
            results.appendChild(info);
        }
    </script>
</body>
</html>
