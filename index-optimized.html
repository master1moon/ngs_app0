<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    
    <!-- Preload Critical Assets -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/Amiri-Regular.woff2" crossorigin>
    <link rel="preload" as="style" href="./css/main.css">
    
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة كروت الشبكات اللاسلكية</title>
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Local CSS -->
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <!-- شريط علوي للجوال -->
    <div class="w-100 d-flex d-md-none align-items-center px-3 py-2 mobile-topbar" style="background:#f8f9fa;position:sticky;top:0;z-index:3001;direction:ltr;">
        <button id="menuToggle" type="button" class="btn btn-link p-0 border-0 me-2">
            <span class="burger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <span class="fw-bold">القائمة</span>
        </div>
        <span class="small text-muted" id="mobileTopDate" style="margin-left:auto;"></span>
    </div>

    <!-- الإشعارات -->
    <div id="notification" class="notification">
        <i class="fas fa-check-circle me-2"></i>
        <span id="notificationText"></span>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div class="app-container">
        <!-- الشريط الجانبي -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <!-- شريط العنوان -->
            <div class="header-bar">
                <h2 class="page-title">لوحة التحكم</h2>
                <div>
                    <span id="currentDate" class="text-muted me-3"></span>
                    <span id="currentMonth" class="text-muted me-3"></span>
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#backupModal">
                        <i class="fas fa-database me-1"></i> النسخ الاحتياطي
                    </button>
                </div>
            </div>

            <!-- الأقسام الديناميكية -->
            <div id="content-area"></div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- درج الجوال -->
    <div id="mobileDrawer" class="mobile-drawer"></div>
    <div id="drawerBackdrop" class="drawer-backdrop"></div>

    <!-- Footer -->
    <footer class="site-footer text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-2">
                تطوير: <span class="developer">أحمد الزهراني</span>
            </p>
            <p class="mb-0">
                <a href="tel:00966538801996" class="contact">
                    <i class="fas fa-phone"></i> 0538801996
                </a>
            </p>
            <small>&copy; 2024 جميع الحقوق محفوظة</small>
        </div>
    </footer>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/ar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Security and Optimization -->
    <script src="./js/security.js"></script>
    <script src="./js/encryption.js"></script>
    <script src="./js/safeDOM.js"></script>
    <script src="./js/domOptimizer.js"></script>
    <script src="./js/dataValidator.js"></script>
    <script src="./js/quickFixes.js"></script>
    
    <!-- Core Utilities -->
    <script src="./js/utils.js"></script>
    <script src="./js/dataManager.js"></script>
    
    <!-- Feature Modules -->
    <script src="./js/reports.js"></script>
    <script src="./app.js"></script>
    <script src="./js/inventory.js"></script>
    <script src="./js/sales.js"></script>
    <script src="./js/payments.js"></script>
    <script src="./js/expenses.js"></script>
    <script src="./js/stores.js"></script>
    <script src="./js/packages.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/backup.js"></script>
    <script src="./js/backupManager.js"></script>
    <script src="./js/expensesTypes.js"></script>
    <script src="./js/trash.js"></script>
    <script src="./js/performanceHelpers.js"></script>
    
    <!-- Main Application -->
    <script src="./js/main.js"></script>
</body>
</html>
